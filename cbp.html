<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Benchmark B2B / cross-border — corredor USDC→COP</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262a33;--txt:#e6e8ec;--muted:#8b93a1;--accent:#3a2a4a;--err:#e2555a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;}
  h1{font-size:17px;margin:0;font-weight:650;}
  .controls{display:flex;gap:12px;align-items:center;margin-left:auto;flex-wrap:wrap;}
  label{color:var(--muted);font-size:13px;}
  input{width:130px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit;}
  button{background:#2b6cff;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;}
  a.back{color:var(--muted);font-size:13px;text-decoration:none;}
  .meta{color:var(--muted);font-size:12.5px;padding:10px 22px 0;}
  .meta b{color:var(--txt);}
  main{padding:8px 22px 40px;}
  .wrap{overflow-x:auto;margin-top:14px;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12.5px;}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--accent);}
  .dim{color:var(--muted);}
  .pending{color:var(--muted);font-size:12.5px;margin-top:16px;border-top:1px solid var(--line);padding-top:12px;}
  .pending li{margin:6px 0;}
  .err{color:var(--err);}
  .note{color:var(--muted);font-size:12.5px;margin-top:6px;}
</style>
</head>
<body>
<header>
  <h1>Benchmark B2B / cross-border — corredor USDC → COP</h1>
  <div class="controls">
    <label>COP a recibir <input id="amt" type="number" min="1" step="1000" value="4000000" /></label>
    <button id="go">Actualizar</button>
    <a class="back" href="/">← Comparador retail</a>
  </div>
</header>
<div class="meta" id="meta">Cargando…</div>
<main id="out"></main>

<script>
const fmt=new Intl.NumberFormat('es-CO',{maximumFractionDigits:2});
const cop=(n)=>n==null?'—':'$'+fmt.format(n);
const pct=(n)=>n==null?'—':n.toFixed(3)+'%';

function render(j){
  const rows=j.rows||[];
  const body=rows.length? rows.map(r=>`
    <tr>
      <td>${r.provider}</td>
      <td><span class="badge">${r.rail}</span></td>
      <td>${r.direction}</td>
      <td>${cop(r.allInRatePerToken)}</td>
      <td>${cop(r.quotedRatePerToken)}</td>
      <td>${pct(r.feePct)}</td>
      <td>${r.transactionFeeToken!=null?r.transactionFeeToken+' '+r.token:'—'}</td>
      <td>${r.minToken!=null?r.minToken+' '+r.token:'—'}</td>
    </tr>`).join('')
    : `<tr><td colspan="8" class="dim">Sin filas activas. Revisa credenciales de las fuentes.</td></tr>`;

  const errs=(j.errors||[]).length
    ? `<p class="note err">Fuentes con error: ${j.errors.map(e=>`${e.provider} (${e.error})`).join(' · ')}</p>`:'';

  const pend=(j.providersPending||[]).length
    ? `<div class="pending"><b>Pendientes (sin API pública de tasa):</b>
        <ul>${j.providersPending.map(p=>`<li><b>${p.label}</b> — ${p.note}</li>`).join('')}</ul></div>`:'';

  return `<div class="wrap"><table>
    <thead><tr>
      <th>Proveedor</th><th>Riel</th><th>Dirección</th>
      <th>Tasa all-in (COP/USDC)</th><th>Tasa bruta</th><th>Fee %</th><th>Fee fijo</th><th>Mínimo</th>
    </tr></thead><tbody>${body}</tbody></table></div>
    <p class="note">All-in = COP recibidos ÷ USDC gastados (neto de comisiones). Tasa bruta = exchangeRate reportado.</p>
    ${errs}${pend}`;
}

async function load(){
  const btn=document.getElementById('go'),meta=document.getElementById('meta'),out=document.getElementById('out');
  const amt=Math.max(1,Number(document.getElementById('amt').value)||4000000);
  btn.disabled=true;meta.textContent='Cargando…';
  try{
    const res=await fetch('/api/cbp-benchmark?fiatAmount='+amt);
    const j=await res.json();
    if(!res.ok)throw new Error(j.detail||j.error||('HTTP '+res.status));
    meta.innerHTML=`COP a recibir <b>${fmt.format(j.fiatAmount)}</b> · ${new Date(j.generatedAt).toLocaleTimeString('es-CO')} · `
      +`activas: <b>${(j.providersActive||[]).map(s=>s.id).join(', ')||'ninguna'}</b>`;
    out.innerHTML=render(j);
  }catch(err){out.innerHTML='';meta.innerHTML=`<span class="err">Error: ${err.message}</span>`;}
  finally{btn.disabled=false;}
}
document.getElementById('go').addEventListener('click',load);
document.getElementById('amt').addEventListener('keydown',e=>{if(e.key==='Enter')load();});
load();
</script>
</body>
</html>
