<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comparador multi-fuente de stablecoins vs Buda</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#262a33;--txt:#e6e8ec;--muted:#8b93a1;
    --buda:#1b2c26;--budaline:#2f6b4f;--win:#e2555a;--lose:#46b17b;
    --spot:#2a3550;--p2p:#4a3a1f;--plat:#3a2a4a;--warn:#c9a227;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;}
  header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;}
  h1{font-size:17px;margin:0;font-weight:650;}
  .controls{display:flex;gap:12px;align-items:center;margin-left:auto;flex-wrap:wrap;}
  label{color:var(--muted);font-size:13px;}
  input{width:110px;background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit;}
  button{background:#2b6cff;color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;}
  button:disabled{opacity:.5;cursor:default;}
  .meta{color:var(--muted);font-size:12.5px;padding:10px 22px 0;}
  .meta b{color:var(--txt);}
  main{padding:8px 22px 40px;}
  .coin{margin-top:22px;}
  .coin h2{font-size:15px;margin:0 0 4px;}
  .rank{color:var(--muted);font-size:13px;margin:0 0 10px;}
  .rank b{color:var(--txt);}
  .wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;}
  th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2),th:nth-child(3),td:nth-child(3){text-align:left;}
  th{color:var(--muted);font-weight:600;font-size:12.5px;position:sticky;top:0;background:var(--bg);}
  tr.buda td{background:var(--buda);}
  tr.buda td:first-child{border-left:3px solid var(--budaline);font-weight:700;}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;}
  .badge.spot{background:var(--spot);}.badge.p2p{background:var(--p2p);}.badge.platform{background:var(--plat);}
  .src{font-size:11px;color:var(--muted);}
  .win{color:var(--win);}.lose{color:var(--lose);}.dim{color:var(--muted);}
  .disc{color:var(--warn);font-size:11px;}
  .stale{color:var(--warn);font-size:11px;}
  .fresh{color:var(--lose);font-size:11px;}
  .legend{color:var(--muted);font-size:12.5px;margin:14px 0 0;display:flex;gap:18px;flex-wrap:wrap;}
  .err{color:var(--win);}
  .pending{color:var(--muted);font-size:12px;margin-top:10px;}
  .capture{margin:22px 0 0;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);}
  .capture h3{margin:0 0 4px;font-size:14px;}
  .capture p{margin:0 0 10px;color:var(--muted);font-size:12.5px;}
  .capture form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .capture select,.capture input{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit;}
  .capture input.num{width:120px;}
  .capture .msg{font-size:12.5px;margin-left:6px;}
</style>
</head>
<body>
<header>
  <h1>Stablecoins en COP — multi-fuente vs Buda</h1>
  <div class="controls">
    <label>Volumen <input id="vol" type="number" min="1" step="1" value="1000" /></label>
    <button id="go">Actualizar</button>
    <a href="/cbp.html" style="color:#8b93a1;font-size:13px;text-decoration:none;">Benchmark B2B →</a>
  </div>
</header>
<div class="meta" id="meta">Cargando…</div>
<main id="out"></main>

<script>
const fmt=new Intl.NumberFormat('es-CO',{maximumFractionDigits:2});
const pct=(n)=>(n>0?'+':'')+n.toFixed(3)+'%';
const cop=(n)=>n==null?'—':'$'+fmt.format(n);

function deltaCell(dCop,dPct,winWhenPositive){
  if(dCop==null)return '<td class="dim">—</td>';
  const wins=winWhenPositive?dCop>0:dCop<0;
  const cls=dCop===0?'dim':(wins?'win':'lose');
  const sign=dCop>0?'+':'';
  return `<td class="${cls}">${sign}${fmt.format(dCop)} <span class="dim">(${pct(dPct)})</span></td>`;
}

function renderCoin(coinName,block){
  const rows=[...block.rows].sort((a,b)=>{
    if(a.totalAsk==null)return 1; if(b.totalAsk==null)return -1; return a.totalAsk-b.totalAsk;
  });
  const bud=rows.filter(r=>r.totalAsk!=null).sort((a,b)=>a.totalAsk-b.totalAsk);
  const sel=rows.filter(r=>r.totalBid!=null).sort((a,b)=>b.totalBid-a.totalBid);
  const bBuy=bud.findIndex(r=>r.isBuda&&r.source==='buda-direct'); const bSell=sel.findIndex(r=>r.isBuda&&r.source==='buda-direct');
  const rankLine=(bBuy>=0||bSell>=0)
    ? `Buda: <b>#${bBuy+1}</b>/${bud.length} más barato para <b>comprar</b> · <b>#${bSell+1}</b>/${sel.length} mejor para <b>vender</b>`
    : 'Buda directo no disponible en este par.';

  const body=rows.map(x=>{
    const disc=x.crossCheckPct?` <span class="disc" title="Diferencia entre fuentes para este venue">⚠ ${pct(x.crossCheckPct)}</span>`:'';
    const basis=x.feeBasis==='fee-inclusive'?'con comisión':x.feeBasis==='raw'?'sin comisión':x.feeBasis==='manual-capture'?'captura manual':x.feeBasis;
    let age='';
    if(x.source==='manual'){
      age=x.ageHours==null?' <span class="stale">sin fecha</span>'
        :x.stale?` <span class="stale" title="Observado hace ${x.ageHours} h — posiblemente obsoleto">⌛ ${x.ageHours}h</span>`
        :` <span class="fresh" title="Observado hace ${x.ageHours} h">✓ ${x.ageHours}h</span>`;
    }
    return `<tr class="${x.isBuda?'buda':''}">
      <td>${x.venue}${disc}${age}</td>
      <td><span class="badge ${x.type}">${x.type}</span></td>
      <td class="src">${x.source}<br><span class="dim">${basis}</span></td>
      <td>${cop(x.totalAsk)}</td>
      ${x.venue==='buda'?'<td class="dim">ref</td>':deltaCell(x.buyDeltaCop,x.buyDeltaPct,false)}
      <td>${cop(x.totalBid)}</td>
      ${x.venue==='buda'?'<td class="dim">ref</td>':deltaCell(x.sellDeltaCop,x.sellDeltaPct,true)}
    </tr>`;}).join('');

  const errs=block.errors&&block.errors.length
    ? `<p class="pending">Fuentes con error: ${block.errors.map(e=>`${e.source} (${e.error})`).join(' · ')}</p>`:'';

  return `<section class="coin"><h2>${coinName.toUpperCase()} / COP</h2>
    <p class="rank">${rankLine}</p>
    <div class="wrap"><table>
      <thead><tr><th>Venue</th><th>Tipo</th><th>Fuente / base</th>
        <th>Compra</th><th>Δ compra vs Buda</th><th>Venta</th><th>Δ venta vs Buda</th></tr></thead>
      <tbody>${body}</tbody></table></div>${errs}</section>`;
}

async function load(){
  const btn=document.getElementById('go'),meta=document.getElementById('meta'),out=document.getElementById('out');
  const vol=Math.max(1,Number(document.getElementById('vol').value)||1000);
  btn.disabled=true;meta.textContent='Cargando…';
  try{
    const res=await fetch('/api/quotes?volume='+vol);
    const j=await res.json();
    if(!res.ok)throw new Error(j.detail||j.error||('HTTP '+res.status));
    meta.innerHTML=`Volumen <b>${fmt.format(j.volume)}</b> · ${new Date(j.generatedAt).toLocaleTimeString('es-CO')} · `
      +`fuentes activas: <b>${j.sourcesActive.map(s=>s.id).join(', ')}</b>`;
    out.innerHTML=Object.entries(j.data).map(([c,b])=>renderCoin(c,b)).join('')
      +`<div class="legend">
          <span><span class="win">rojo</span>: el competidor le gana a Buda</span>
          <span><span class="lose">verde</span>: Buda le gana</span>
          <span><span class="badge spot">spot</span> ejecutable · <span class="badge p2p">p2p</span> mejor aviso · <span class="badge platform">platform</span> tasa de plataforma</span>
          <span><span class="disc">⚠</span> discrepancia entre fuentes</span>
        </div>`
      +captureFormHTML();
    wireCapture();
  }catch(err){out.innerHTML='';meta.innerHTML=`<span class="err">Error: ${err.message}</span>`;}
  finally{btn.disabled=false;}
}

// --- Captura manual de plataformas cerradas (Plenti, Littio, VIIO, Wenia) ---
function captureFormHTML(){
  return `<div class="capture">
    <h3>Registrar tasa observada (plataformas cerradas)</h3>
    <p>Plenti, Littio, VIIO y Wenia no exponen API pública: su tasa solo se ve dentro de la app.
       Aquí registras una observación real; se muestra con marca de antigüedad, nunca como feed en vivo.</p>
    <form id="capForm">
      <select id="capVenue"></select>
      <select id="capCoin"><option value="usdc">USDC</option><option value="usdt">USDT</option></select>
      <input class="num" id="capAsk" type="number" step="0.01" placeholder="Compra (COP)" />
      <input class="num" id="capBid" type="number" step="0.01" placeholder="Venta (COP)" />
      <input id="capObs" placeholder="Observador (opcional)" />
      <button type="submit">Guardar</button>
      <span class="msg dim" id="capMsg"></span>
    </form>
  </div>`;
}

async function wireCapture(){
  const sel=document.getElementById('capVenue');
  if(!sel)return;
  try{
    const meta=await (await fetch('/api/platform-rates')).json();
    const known=meta.known||{plenti:'Plenti',littio:'Littio',viio:'VIIO',wenia:'Wenia'};
    sel.innerHTML=Object.entries(known).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  }catch{ sel.innerHTML=['plenti','littio','viio','wenia'].map(k=>`<option value="${k}">${k}</option>`).join(''); }
  document.getElementById('capForm').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const msg=document.getElementById('capMsg');
    const body={
      venue:sel.value, coin:document.getElementById('capCoin').value, fiat:'cop',
      ask:document.getElementById('capAsk').value||null,
      bid:document.getElementById('capBid').value||null,
      observer:document.getElementById('capObs').value||null,
    };
    msg.textContent='Guardando…';msg.className='msg dim';
    try{
      const r=await fetch('/api/platform-rates',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json();
      if(!r.ok||!j.ok)throw new Error(j.error||('HTTP '+r.status));
      msg.textContent='Guardado. Actualizando…';msg.className='msg fresh';
      load();
    }catch(err){ msg.textContent='Error: '+err.message; msg.className='msg err'; }
  });
}

document.getElementById('go').addEventListener('click',load);
document.getElementById('vol').addEventListener('keydown',e=>{if(e.key==='Enter')load();});
load();
</script>
</body>
</html>
